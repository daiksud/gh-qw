# Managed with gh-infra v0.13.0; see docs/contributing.md#repository-settings.
# CI validates offline. Review the plan and apply locally.
apiVersion: gh-infra/v1
kind: Repository
metadata:
  name: gh-qw
  owner: daiksud

# Omitted labels and rulesets are deleted when applying this manifest.
reconcile:
  labels: authoritative
  rulesets: authoritative

spec:
  description: ""
  visibility: public
  archived: false

  labels:
  - name: BREAKING CHANGE
    description: Backward-incompatible user-visible behavior or public interface
    color: b60205
  - name: DEPRECATED
    description: Public feature or behavior marked for future removal
    color: fbca04
  - name: accessibility
    description: Accessibility issues or improvements
    color: f143ab
  - name: build
    description: Build, packaging, release tooling, or dependency management
    color: a8aeb4
  - name: chore
    description: Maintenance not covered by a more specific change type
    color: ededed
  - name: ci
    description: CI checks and repository development automation
    color: cfd3d7
  - name: docs
    description: Documentation or contributor and reviewer guidance
    color: c4b5e0
  - name: duplicate
    description: This issue or pull request already exists
    color: cfd3d7
  - name: feat
    description: New user-facing capability or behavior
    color: 0e8a16
  - name: fix
    description: Correction to user-observable product behavior
    color: 0052cc
  - name: good first issue
    description: Good for newcomers
    color: 7057ff
  - name: help wanted
    description: Extra attention is needed
    color: 008672
  - name: invalid
    description: This does not seem right
    color: e4e669
  - name: perf
    description: Runtime performance improvement experienced by product users
    color: 7fd18a
  - name: question
    description: Further information is requested
    color: d876e3
  - name: refactor
    description: Implementation restructuring without user-observable behavior changes
    color: 8ec9cc
  - name: revert
    description: Reverts a previous change; assess resulting user impact
    color: 79b8ff
  - name: style
    description: Formatting changes without behavior changes
    color: b5dcde
  - name: test
    description: Test-only additions or corrections
    color: d8ecec
  - name: wontfix
    description: This will not be worked on
    color: ffffff

  features:
    issues: true
    projects: true
    wiki: false
    discussions: false
    pull_requests: true

  merge_strategy:
    allow_merge_commit: false
    allow_squash_merge: true
    allow_rebase_merge: false
    allow_auto_merge: true
    auto_delete_head_branches: true
    squash_merge_commit_title: PR_TITLE
    squash_merge_commit_message: PR_BODY
    merge_commit_title: PR_TITLE
    merge_commit_message: PR_BODY

  release_immutability: true

  security:
    vulnerability_alerts: true
    automated_security_fixes: true
    private_vulnerability_reporting: true

  rulesets:
  - name: default
    target: branch
    enforcement: active
    bypass_actors: []
    conditions:
      ref_name:
        include:
        - ~DEFAULT_BRANCH
    rules:
      pull_request:
        required_approving_review_count: 1
        dismiss_stale_reviews_on_push: true
        require_code_owner_review: true
        require_last_push_approval: false
        required_review_thread_resolution: true
      required_status_checks:
        strict_required_status_checks_policy: true
        contexts:
        - context: pass
          app: github-actions
      non_fast_forward: true
      deletion: true
      creation: false
      required_linear_history: true
      required_signatures: true
  - name: default-tag
    target: tag
    enforcement: active
    conditions:
      ref_name:
        include:
        - ~ALL
    rules:
      non_fast_forward: true
      deletion: true
      creation: false
      required_linear_history: false
      required_signatures: false

  actions:
    enabled: true
    allowed_actions: all
    sha_pinning_required: true
    workflow_permissions: read
    can_approve_pull_requests: true
    fork_pr_approval: first_time_contributors
