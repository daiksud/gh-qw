# Declarative GitHub repository settings for gh-qw, managed by gh-infra
# (https://github.com/babarot/gh-infra). See docs/reference/repository-settings/
# for the operating model (review, apply, what is intentionally unmanaged) and
# docs/development/adr/0012-github-settings-as-code/ for why `apply` stays a
# local, manual operation while CI only ever holds a read-only token.
apiVersion: gh-infra/v1
kind: Repository
metadata:
  name: gh-qw
  owner: daiksud

# authoritative means gh-infra deletes any label or ruleset that exists on
# GitHub but is absent from spec below. Always review `gh infra plan` output
# before `gh infra apply` — a removed entry here is a real deletion, not a
# no-op.
reconcile:
  labels: authoritative
  rulesets: authoritative

spec:
  description: ""
  visibility: public
  archived: false

  # Label vocabulary and colors are defined here; this is the single source
  # of truth going forward (see docs/development/adr/0011-type-named-release-labels/
  # for the naming rationale and docs/reference/versioning/#labels for which
  # six labels affect the computed release version).
  labels:
  - name: BREAKING CHANGE
    description: Backward-incompatible public API change (MAJOR; MINOR under 0.y.z)
    color: b60205
  - name: DEPRECATED
    description: Public API marked for future removal (MINOR; PATCH under 0.y.z)
    color: fbca04
  - name: build
    description: Changes to the build system or external dependencies (no version bump)
    color: a8aeb4
  - name: chore
    description: Other changes that don't modify src or test files (no version bump)
    color: ededed
  - name: ci
    description: Changes to CI configuration files and scripts (no version bump)
    color: cfd3d7
  - name: docs
    description: Documentation only changes (no version bump)
    color: c4b5e0
  - name: duplicate
    description: This issue or pull request already exists
    color: cfd3d7
  - name: feat
    description: A new feature (MINOR; PATCH under 0.y.z)
    color: 0e8a16
  - name: fix
    description: A bug fix (PATCH)
    color: 0052cc
  - name: good first issue
    description: Good for newcomers
    color: 7057ff
  - name: help wanted
    description: Extra attention is needed
    color: 008672
  - name: invalid
    description: This doesn't seem right
    color: e4e669
  - name: perf
    description: A code change that improves performance (MINOR; PATCH under 0.y.z)
    color: 7fd18a
  - name: question
    description: Further information is requested
    color: d876e3
  - name: refactor
    description: A code change that neither fixes a bug nor adds a feature (no version bump)
    color: 8ec9cc
  - name: revert
    description: Reverts a previous commit (PATCH)
    color: 79b8ff
  - name: style
    description: Changes that do not affect the meaning of the code (no version bump)
    color: b5dcde
  - name: test
    description: Adding missing tests or correcting existing tests (no version bump)
    color: d8ecec
  - name: wontfix
    description: This will not be worked on
    color: ffffff

  features:
    issues: true
    projects: true
    wiki: false
    discussions: false
    pull_requests: true

  # allow_auto_merge and the four commit-message-template fields
  # (squash_merge_commit_title/_message, merge_commit_title/_message) are
  # deliberately NOT declared here. GitHub's REST API returns null for all
  # five when read by a GitHub App installation token scoped to
  # Administration: read (confirmed empirically - see ADR-0012), so a
  # read-only CI token can never verify them and would report false drift
  # every time. gh-infra's MergeStrategy fields are individually optional
  # (each is a nil-able pointer; omitting one means "unmanaged", not
  # "enforce the zero value" - see internal/repository/diff.go's
  # appendChildChanged), so omitting them here removes them from both
  # `plan` and `apply` entirely rather than fighting a permanently
  # unreliable comparison. They remain part of the repository settings
  # reference's list of settings managed manually, outside this manifest.
  merge_strategy:
    allow_merge_commit: false
    allow_squash_merge: true
    allow_rebase_merge: false
    auto_delete_head_branches: true

  release_immutability: true

  security:
    vulnerability_alerts: true
    automated_security_fixes: true
    private_vulnerability_reporting: true

  # Rulesets, not classic branch protection, enforce main and tag rules
  # (gh-infra supports both; rulesets are its recommended approach).
  rulesets:
  - name: default
    target: branch
    enforcement: active
    conditions:
      ref_name:
        include:
        - ~DEFAULT_BRANCH
    rules:
      pull_request:
        required_approving_review_count: 0
        dismiss_stale_reviews_on_push: false
        require_code_owner_review: false
        require_last_push_approval: false
        required_review_thread_resolution: true
      non_fast_forward: true
      deletion: true
      creation: false
      required_linear_history: false
      required_signatures: true
  - name: default-tag
    target: tag
    enforcement: active
    conditions:
      ref_name:
        include:
        - ~ALL
    rules:
      non_fast_forward: true
      deletion: true
      creation: false
      required_linear_history: false
      required_signatures: false

  actions:
    enabled: true
    allowed_actions: all
    sha_pinning_required: true
    workflow_permissions: read
    can_approve_pull_requests: false
    fork_pr_approval: first_time_contributors
