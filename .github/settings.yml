# Declare only resources gh-settings supports. Unlisted labels and Rulesets
# remain unchanged; IDs refer to existing gh-qw objects, not gh-settings IDs.
schemaVersion: 1
settings:
  repository:
    description: ""
    archived: false
    has_issues: true
    has_projects: true
    has_wiki: false
    has_discussions: false
    has_pull_requests: true
    allow_merge_commit: false
    allow_squash_merge: true
    allow_rebase_merge: false
    allow_auto_merge: true
    delete_branch_on_merge: true
    squash_merge_commit_title: PR_TITLE
    squash_merge_commit_message: PR_BODY
  labels:
    - id: 12849416294
      name: "accessibility"
      color: "f143ab"
      description: "Barrier affecting people with disabilities"
    - id: 12930185307
      name: "bug"
      color: "d73a4a"
      description: "Something isn't working"
    - id: 12930185431
      name: "documentation"
      color: "0075ca"
      description: "Improvements or additions to documentation"
    - id: 11736169750
      name: "duplicate"
      color: "cfd3d7"
      description: "This issue or pull request already exists"
    - id: 12930185558
      name: "enhancement"
      color: "a2eeef"
      description: "New feature or request"
    - id: 11736169765
      name: "good first issue"
      color: "7057ff"
      description: "Good for newcomers"
    - id: 11736169760
      name: "help wanted"
      color: "008672"
      description: "Extra attention is needed"
    - id: 11736169769
      name: "invalid"
      color: "e4e669"
      description: "This doesn't seem right"
    - id: 11736169775
      name: "question"
      color: "d876e3"
      description: "Further information is requested"
    - id: 11736169781
      name: "wontfix"
      color: "ffffff"
      description: "This will not be worked on"
  # Adopt existing live Rulesets by ID, retaining both branch and tag protection.
  rulesets:
    - id: 20506385
      name: default
      target: branch
      enforcement: active
      conditions:
        ref_name:
          include: ["~DEFAULT_BRANCH"]
          exclude: []
      bypass_actors: []
      rules:
        - type: deletion
        - type: non_fast_forward
        - type: required_linear_history
        - type: required_signatures
        - type: pull_request
          parameters:
            required_approving_review_count: 1
            dismiss_stale_reviews_on_push: true
            required_reviewers: []
            require_code_owner_review: true
            require_last_push_approval: false
            required_review_thread_resolution: true
            require_extra_approval_for_unattributed_changes: true
            allowed_merge_methods: [merge, rebase, squash]
        - type: required_status_checks
          parameters:
            strict_required_status_checks_policy: true
            do_not_enforce_on_create: false
            required_status_checks:
              - context: ci-pr
                integration_id: 15368
              - context: prlint
                integration_id: 15368
    - id: 20506408
      name: default-tag
      target: tag
      enforcement: active
      conditions:
        ref_name:
          include: ["~ALL"]
          exclude: []
      bypass_actors: []
      rules:
        - type: deletion
        - type: non_fast_forward
  actions:
    enabled: true
    allowed_actions: all
    sha_pinning_required: true
    default_workflow_permissions: read
    can_approve_pull_request_reviews: true
    fork_pr_approval_policy: first_time_contributors
  security:
    private_vulnerability_reporting: true
  # Retain the complete observed protections of these named Environments.
  # Unlisted Environments remain unmanaged; pattern IDs are API-internal.
  environments:
    - name: copilot
      wait_timer: 0
      prevent_self_review: false
      reviewers: []
      can_admins_bypass: true
      deployment_branch_policy: null
    - name: github-pages
      wait_timer: 0
      prevent_self_review: false
      reviewers: []
      can_admins_bypass: true
      deployment_branch_policy:
        protected_branches: false
        custom_branch_policies: true
      deployment_branch_patterns:
        - type: branch
          name: main
