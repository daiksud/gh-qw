# Declare only resources gh-settings supports. Unlisted labels and Rulesets
# remain unchanged; IDs refer to existing gh-qw objects, not gh-settings IDs.
schemaVersion: 1
settings:
  repository:
    description: ""
    archived: false
    has_issues: true
    has_projects: true
    has_wiki: false
    has_discussions: false
    has_pull_requests: true
    allow_merge_commit: false
    allow_squash_merge: true
    allow_rebase_merge: false
    allow_auto_merge: true
    delete_branch_on_merge: true
    squash_merge_commit_title: PR_TITLE
    squash_merge_commit_message: PR_BODY
  labels:
    - id: 11747904126
      name: "BREAKING CHANGE"
      color: "b60205"
      description: "Backward-incompatible user-visible behavior or public interface"
    - id: 11747904146
      name: "DEPRECATED"
      color: "fbca04"
      description: "Public feature or behavior marked for future removal"
    - id: 12849416294
      name: "accessibility"
      color: "f143ab"
      description: "Accessibility issues or improvements"
    - id: 11747904551
      name: "build"
      color: "a8aeb4"
      description: "Build, packaging, release tooling, or dependency management"
    - id: 11747904620
      name: "chore"
      color: "ededed"
      description: "Maintenance not covered by a more specific change type"
    - id: 11747904584
      name: "ci"
      color: "cfd3d7"
      description: "CI checks and repository development automation"
    - id: 11747904352
      name: "docs"
      color: "c4b5e0"
      description: "Documentation or contributor and reviewer guidance"
    - id: 11736169750
      name: "duplicate"
      color: "cfd3d7"
      description: "This issue or pull request already exists"
    - id: 11747904181
      name: "feat"
      color: "0e8a16"
      description: "New user-facing capability or behavior"
    - id: 11747904250
      name: "fix"
      color: "0052cc"
      description: "Correction to user-observable product behavior"
    - id: 11736169765
      name: "good first issue"
      color: "7057ff"
      description: "Good for newcomers"
    - id: 11736169760
      name: "help wanted"
      color: "008672"
      description: "Extra attention is needed"
    - id: 11736169769
      name: "invalid"
      color: "e4e669"
      description: "This does not seem right"
    - id: 11747904197
      name: "perf"
      color: "7fd18a"
      description: "Runtime performance improvement experienced by product users"
    - id: 11736169775
      name: "question"
      color: "d876e3"
      description: "Further information is requested"
    - id: 11747904379
      name: "refactor"
      color: "8ec9cc"
      description: "Implementation restructuring without user-observable behavior changes"
    - id: 11747904297
      name: "revert"
      color: "79b8ff"
      description: "Reverts a previous change; assess resulting user impact"
    - id: 11747904422
      name: "style"
      color: "b5dcde"
      description: "Formatting changes without behavior changes"
    - id: 11747904492
      name: "test"
      color: "d8ecec"
      description: "Test-only additions or corrections"
    - id: 11736169781
      name: "wontfix"
      color: "ffffff"
      description: "This will not be worked on"
  # Adopt existing live Rulesets by ID, retaining both branch and tag protection.
  rulesets:
    - id: 20506385
      name: default
      target: branch
      enforcement: active
      conditions:
        ref_name:
          include: ["~DEFAULT_BRANCH"]
          exclude: []
      bypass_actors: []
      rules:
        - type: deletion
        - type: non_fast_forward
        - type: required_linear_history
        - type: required_signatures
        - type: pull_request
          parameters:
            required_approving_review_count: 1
            dismiss_stale_reviews_on_push: true
            required_reviewers: []
            require_code_owner_review: true
            require_last_push_approval: false
            required_review_thread_resolution: true
            require_extra_approval_for_unattributed_changes: true
            allowed_merge_methods: [merge, rebase, squash]
        - type: required_status_checks
          parameters:
            strict_required_status_checks_policy: true
            do_not_enforce_on_create: false
            required_status_checks:
              - context: ci-pr
                integration_id: 15368
              - context: prlint
                integration_id: 15368
    - id: 20506408
      name: default-tag
      target: tag
      enforcement: active
      conditions:
        ref_name:
          include: ["~ALL"]
          exclude: []
      bypass_actors: []
      rules:
        - type: deletion
        - type: non_fast_forward
  actions:
    enabled: true
    allowed_actions: all
    sha_pinning_required: true
    default_workflow_permissions: read
    can_approve_pull_request_reviews: true
    fork_pr_approval_policy: first_time_contributors
  security:
    private_vulnerability_reporting: true
