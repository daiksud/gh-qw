name: Deploy documentation

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".pages/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build documentation
    # Astro build and artifact packaging fit slim; tar and zstd are preinstalled.
    runs-on: ubuntu-slim
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@313600b80b104eadebb9111787d37a2e83e014ca # v1.17.0
        with:
          version: "0.2.8"
          node-version: "24.19.0"
          working-directory: .pages
          cache: true
          run-install: false

      - name: Install documentation dependencies
        working-directory: .pages
        run: vp install --frozen-lockfile

      - name: Build documentation
        working-directory: .pages
        run: vpr build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: .pages/dist

  deploy:
    name: Deploy documentation
    needs: build
    # Deployment only invokes the Pages action and is a lightweight slim workload.
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
