name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Format and vet
    # Formatting and vetting are lightweight Go checks that fit ubuntu-slim.
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt-formatted:"
            printf '%s\n' "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

  test:
    name: Build and test (${{ matrix.os }}, ${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          # ubuntu-slim is x64-only; retain the dedicated arm64 runner below.
          - os: ubuntu-slim
            arch: amd64
          - os: ubuntu-24.04-arm
            arch: arm64
          - os: macos-14
            arch: arm64
          - os: windows-latest
            arch: amd64
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./...

  race:
    name: Race detector (Ubuntu amd64)
    # Current race runs fit within ubuntu-slim's 5 GB container.
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Test with race detector
        run: go test -race ./...

  settings:
    name: Validate repository settings
    # Offline manifest validation is a lightweight ubuntu-slim workload.
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install gh-infra
        # Pinned: gh-infra treats unknown YAML keys as hard errors, so the
        # manifest is coupled to this binary version.
        run: gh extension install babarot/gh-infra --pin v0.13.0
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Validate manifest syntax and schema
        # Fully offline (no GitHub API calls), so this runs for fork pull
        # requests too, where secrets are unavailable. Applying a settings
        # change is a deliberate, local, manual step — see
        # docs/reference/repository-settings/ and ADR-0012 for why.
        run: gh infra validate .github/settings.yml

  release-tests:
    name: Test release preparation
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run release preparation tests
        run: bash .github/scripts/prepare-release.test.sh

  gate:
    name: CI success
    if: always()
    needs:
      - lint
      - test
      - race
      - settings
      - release-tests
    # The aggregate gate is a lightweight status-only job.
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - name: Require every CI job to pass
        if: >-
          ${{
            needs.lint.result != 'success' ||
            needs.test.result != 'success' ||
            needs.race.result != 'success' ||
            needs.settings.result != 'success' ||
            needs.release-tests.result != 'success'
          }}
        run: |
          echo "One or more required CI jobs did not succeed."
          echo "lint=${{ needs.lint.result }}"
          echo "test=${{ needs.test.result }}"
          echo "race=${{ needs.race.result }}"
          echo "settings=${{ needs.settings.result }}"
          echo "release-tests=${{ needs.release-tests.result }}"
          exit 1

      - name: Report successful CI gate
        run: echo "All required CI jobs passed."
