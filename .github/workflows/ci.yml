name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Format and vet
    # Formatting and vetting are lightweight Go checks that fit ubuntu-slim.
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt-formatted:"
            printf '%s\n' "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

  test:
    name: Build and test (${{ matrix.os }}, ${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          # ubuntu-slim is x64-only; retain the dedicated arm64 runner below.
          - os: ubuntu-slim
            arch: amd64
          - os: ubuntu-24.04-arm
            arch: arm64
          - os: macos-14
            arch: arm64
          - os: windows-latest
            arch: amd64
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./...

  race:
    name: Race detector (Ubuntu amd64)
    # Current race runs fit within ubuntu-slim's 5 GB container.
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Test with race detector
        run: go test -race ./...

  docs:
    name: Validate documentation
    # Documentation validation uses Node tooling without a browser or privileged access.
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@313600b80b104eadebb9111787d37a2e83e014ca # v1.17.0
        with:
          version: "0.2.8"
          node-version: "24.19.0"
          working-directory: .pages
          cache: true
          run-install: false

      - name: Install documentation dependencies
        working-directory: .pages
        run: vp install --frozen-lockfile

      - name: Validate documentation
        working-directory: .pages
        run: vp run validate

  settings:
    name: Validate repository settings
    # Offline manifest validation is a lightweight ubuntu-slim workload.
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install gh-infra
        # Pinned: gh-infra treats unknown YAML keys as hard errors, so the
        # manifest is coupled to this binary version.
        run: gh extension install babarot/gh-infra --pin v0.13.0
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Validate manifest syntax and schema
        # Fully offline (no GitHub API calls), so this runs for fork pull
        # requests too, where secrets are unavailable. Applying a settings
        # change is a deliberate, local, manual step — see
        # docs/reference/repository-settings/ and ADR-0012 for why.
        run: gh infra validate .github/settings.yml
