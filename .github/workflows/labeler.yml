name: Labeler

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  labeler:
    name: Apply labels
    # This API-only action job is a lightweight fit for ubuntu-slim.
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      # No checkout: actions/labeler reads .github/labeler.yml from the base
      # repository through the GitHub API, so a fork pull request's code is
      # never checked out or executed by this privileged pull_request_target
      # workflow.
      - name: Apply labels from branch name and changed files
        uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        with:
          sync-labels: true
