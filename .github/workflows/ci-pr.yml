name: ci-pr
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
permissions: {}
defaults:
  run:
    shell: bash
concurrency:
  group: ci-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  draft:
    runs-on: ubuntu-slim
    timeout-minutes: 3
    permissions: {contents: write, pull-requests: write}
    steps:
      - name: Set draft state
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh pr ready "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --undo
  resolve:
    needs: draft
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions: {contents: read}
    outputs:
      build-matrix: ${{ steps.metadata.outputs.build-matrix }}
      acceptance-matrix: ${{ steps.metadata.outputs.acceptance-matrix }}
    steps:
      - name: Checkout validation source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Resolve CI target matrices
        id: metadata
        uses: ./.github/actions/ci-metadata
  commit-stage:
    needs: resolve
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions: {contents: read}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve.outputs.build-matrix) }}
    steps:
      - name: Checkout validation source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Check source and build candidate
        id: build
        uses: ./.github/actions/ci-commit
        with:
          target: ${{ matrix.target }}
          source-sha: ${{ github.sha }}
      - name: Transfer candidate artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-${{ matrix.target }}-${{ github.sha }}
          path: ${{ steps.build.outputs.artifact-directory }}
          if-no-files-found: error
          overwrite: true
          retention-days: 1
  ready:
    needs: commit-stage
    runs-on: ubuntu-slim
    timeout-minutes: 3
    permissions: {contents: write, pull-requests: write}
    steps:
      - name: Set ready state
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh pr ready "$PR_NUMBER" --repo "$GITHUB_REPOSITORY"
  acceptance-stage:
    needs: [resolve, commit-stage, ready]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions: {contents: read}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve.outputs.acceptance-matrix) }}
    steps:
      - name: Checkout candidate source separately from the consumer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: .action
          persist-credentials: false
      - name: Retrieve this run's candidate artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ci-${{ matrix.target }}-${{ github.sha }}
          path: ${{ runner.temp }}/product
          digest-mismatch: error
      - name: Accept the transferred candidate
        uses: ./.action/.github/actions/ci-acceptance
        with:
          target: ${{ matrix.target }}
          kind: ${{ matrix.kind }}
          source-sha: ${{ github.sha }}
          artifact-directory: ${{ runner.temp }}/product
  ci-pr:
    needs: [draft, resolve, commit-stage, ready, acceptance-stage]
    if: always()
    runs-on: ubuntu-slim
    timeout-minutes: 3
    permissions: {}
    steps:
      - name: Require every validation stage to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          jq -e 'length == 5 and all(.[]; .result == "success")' <<< "$RESULTS" > /dev/null
