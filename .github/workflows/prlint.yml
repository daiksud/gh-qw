name: prlint

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions: {}

defaults:
  run:
    shell: bash

concurrency:
  group: prlint-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  prlint:
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out message validation policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json

      - name: Install message validation dependencies
        run: bun install --ignore-scripts

      - name: Inspect generated dependency lockfile
        run: cat bun.lock

      - name: Verify message validation behavior
        run: |
          printf 'build: verify local commitlint\n' | bun run --bun --no-install commitlint --strict
          if printf 'invalid message\n' | bun run --bun --no-install commitlint --strict; then
            echo 'Expected commitlint to reject an invalid message' >&2
            exit 1
          fi

      - name: Validate current PR title and body
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          printf '%s\n\n%s\n' "$PR_TITLE" "$PR_BODY" |
            bun run --bun --no-install commitlint --strict
