name: release
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Optional immutable main commit to require (for reviewed dispatch)
        required: false
        type: string
permissions: {}
defaults:
  run:
    shell: bash
concurrency:
  # Serialize publication without cancelling an active release; ordering is not FIFO.
  group: release-${{ github.repository }}
  cancel-in-progress: false
jobs:
  resolve:
    runs-on: ubuntu-slim
    timeout-minutes: 10
    permissions: {contents: read}
    outputs:
      source-sha: ${{ github.sha }}
      version: ${{ steps.metadata.outputs.version }}
      previous-tag: ${{ steps.metadata.outputs.previous-tag }}
      previous-sha: ${{ steps.metadata.outputs.previous-sha }}
      build-matrix: ${{ steps.metadata.outputs.build-matrix }}
      acceptance-matrix: ${{ steps.metadata.outputs.acceptance-matrix }}
    steps:
      - name: Require a main-branch dispatch
        env:
          SOURCE_REF: ${{ github.ref }}
        run: |
          [[ "$SOURCE_REF" == 'refs/heads/main' ]] || {
            echo 'release must be dispatched from main' >&2; exit 1
          }
      - name: Require the dispatched main commit to remain current
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          current_main="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          [[ "$current_main" =~ ^[0-9a-f]{40}$ ]]
          [[ "$current_main" == "$SOURCE_SHA" ]] || {
            echo 'main moved since dispatch; start a new release workflow' >&2; exit 1
          }
      - name: Validate the optional reviewed source pin
        env:
          SOURCE_SHA: ${{ github.sha }}
          EXPECTED_SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          if [[ -n "$EXPECTED_SOURCE_SHA" ]]; then
            [[ "$EXPECTED_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || {
              echo 'invalid source_sha (expected full 40-character SHA)' >&2; exit 1
            }
            [[ "$SOURCE_SHA" == "$EXPECTED_SOURCE_SHA" ]] || {
              echo 'dispatched main differs from approved source_sha; refusing a different release source' >&2; exit 1
            }
          fi
      - name: Checkout frozen main and complete release history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve release metadata and validated target matrices
        id: metadata
        uses: ./.github/actions/release-metadata
        with:
          source-sha: ${{ github.sha }}
        env:
          GH_TOKEN: ${{ github.token }}
  commit-stage:
    needs: resolve
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions: {contents: read}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve.outputs.build-matrix) }}
    steps:
      - name: Checkout frozen main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Check source and build release artifact
        uses: ./.github/actions/release-build
        with:
          target: ${{ matrix.target }}
          version: ${{ needs.resolve.outputs.version }}
          source-sha: ${{ github.sha }}
  acceptance-stage:
    needs: [resolve, commit-stage]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions: {contents: read}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve.outputs.acceptance-matrix) }}
    steps:
      - name: Checkout frozen source separately from the consumer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: .action
          persist-credentials: false
      - name: Accept the transferred release artifact
        uses: ./.action/.github/actions/release-acceptance
        with:
          target: ${{ matrix.target }}
          version: ${{ needs.resolve.outputs.version }}
          source-sha: ${{ github.sha }}
  release:
    needs: [resolve, commit-stage, acceptance-stage]
    runs-on: ubuntu-slim
    timeout-minutes: 15
    permissions: {contents: write}
    steps:
      - name: Checkout frozen main and complete release history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Publish accepted release artifacts
        uses: ./.github/actions/release-publish
        with:
          source-sha: ${{ github.sha }}
          version: ${{ needs.resolve.outputs.version }}
          previous-tag: ${{ needs.resolve.outputs.previous-tag }}
          previous-sha: ${{ needs.resolve.outputs.previous-sha }}
        env:
          GH_TOKEN: ${{ github.token }}
  verify-release:
    needs: [resolve, release]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions: {contents: read}
    steps:
      - name: Checkout frozen verification source separately from the consumer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: .action
          persist-credentials: false
      - name: Verify immutable published release
        uses: ./.action/.github/actions/release-verify
        with:
          source-sha: ${{ github.sha }}
          version: ${{ needs.resolve.outputs.version }}
