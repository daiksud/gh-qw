name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.asset }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: darwin
            goarch: amd64
            asset: gh-qw-darwin-amd64
          - goos: darwin
            goarch: arm64
            asset: gh-qw-darwin-arm64
          - goos: linux
            goarch: amd64
            asset: gh-qw-linux-amd64
          - goos: linux
            goarch: arm64
            asset: gh-qw-linux-arm64
          - goos: windows
            goarch: amd64
            asset: gh-qw-windows-amd64.exe

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -trimpath -ldflags="-s -w -X main.version=${GITHUB_REF_NAME}" -o 'dist/${{ matrix.asset }}' .

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error
          retention-days: 1

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download assets
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            "dist/gh-qw-darwin-amd64" \
            "dist/gh-qw-darwin-arm64" \
            "dist/gh-qw-linux-amd64" \
            "dist/gh-qw-linux-arm64" \
            "dist/gh-qw-windows-amd64.exe"
