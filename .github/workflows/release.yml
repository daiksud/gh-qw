name: Release

on:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

defaults:
  run:
    shell: bash

concurrency:
  group: gh-qw-release
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-slim
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      previous_tag: ${{ steps.version.outputs.previous_tag }}
      sha: ${{ steps.version.outputs.sha }}
    steps:
      - name: Require main
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Run the Release workflow from main."
            exit 1
          fi

      - name: Check out the selected commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Compute next version from reviewed labels
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/prepare-release.sh >> "$GITHUB_OUTPUT"

      - name: Summarize release
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          PREVIOUS_TAG: ${{ steps.version.outputs.previous_tag }}
          TARGET_SHA: ${{ steps.version.outputs.sha }}
        run: |
          printf '## Release plan\n\nVersion: %s\n\nPrevious release: %s\n\nCommit: %s\n' \
            "$RELEASE_TAG" "$PREVIOUS_TAG" "$TARGET_SHA" >> "$GITHUB_STEP_SUMMARY"

  validate:
    name: Validate release
    needs: prepare
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  build:
    name: Build ${{ matrix.asset }}
    needs: prepare
    runs-on: ubuntu-slim
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: darwin
            goarch: amd64
            asset: gh-qw-darwin-amd64
          - goos: darwin
            goarch: arm64
            asset: gh-qw-darwin-arm64
          - goos: linux
            goarch: amd64
            asset: gh-qw-linux-amd64
          - goos: linux
            goarch: arm64
            asset: gh-qw-linux-arm64
          - goos: windows
            goarch: amd64
            asset: gh-qw-windows-amd64.exe
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.tag }}
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -trimpath -ldflags="-s -w -X main.version=${RELEASE_VERSION}" -o 'dist/${{ matrix.asset }}' .

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error
          retention-days: 1

  release:
    name: Create GitHub Release
    needs: [prepare, validate, build]
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Check out selected commit and current tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: Publish validated binaries
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          PREVIOUS_TAG: ${{ needs.prepare.outputs.previous_tag }}
          TARGET_SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          set -euo pipefail
          latest_tag="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name)"
          if [ "$latest_tag" != "$PREVIOUS_TAG" ]; then
            echo "::error::The published baseline changed. Start a new Release workflow."
            exit 1
          fi
          existing_tag="$(git tag --list "$RELEASE_TAG")"
          if [ -n "$existing_tag" ]; then
            existing_sha="$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"
            if [ "$existing_sha" != "$TARGET_SHA" ]; then
              echo "::error::The release tag already points to a different commit."
              exit 1
            fi
          fi
          # gh creates a draft, uploads artifacts, then publishes.
          # Any tag is created only during this final publishing phase.
          gh release create "$RELEASE_TAG" \
            --target "$TARGET_SHA" \
            --title "$RELEASE_TAG" \
            --generate-notes \
            --notes-start-tag "$PREVIOUS_TAG" \
            "dist/gh-qw-darwin-amd64" \
            "dist/gh-qw-darwin-arm64" \
            "dist/gh-qw-linux-amd64" \
            "dist/gh-qw-linux-arm64" \
            "dist/gh-qw-windows-amd64.exe"
