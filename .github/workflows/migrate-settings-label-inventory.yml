# Temporary read-only inventory for migrating existing label IDs.
name: migrate-settings-label-inventory
on:
  pull_request:
    types: [opened, synchronize]
permissions: {}
jobs:
  label-ids:
    runs-on: ubuntu-slim
    timeout-minutes: 3
    permissions:
      issues: read
    steps:
      - name: Read existing label IDs without changing them
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/labels?per_page=100" --jq '.[] | "\(.id)\t\(.name)\t\(.color)\t\(.description)"'
