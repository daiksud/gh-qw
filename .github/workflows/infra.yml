name: Infrastructure

on:
  pull_request:
    paths:
      - .github/settings.yml
      - .github/workflows/infra.yml
  schedule:
    # Monthly drift check: the 1st of each month at 9am UTC.
    - cron: "0 9 1 * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate settings manifest
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install gh-infra
        # Pinned: gh-infra treats unknown YAML keys as hard errors, so the
        # manifest is coupled to this binary version.
        run: gh extension install babarot/gh-infra --pin v0.13.0
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Validate manifest syntax and schema
        # Fully offline (no GitHub API calls), so this runs for fork pull
        # requests too, where secrets are unavailable.
        run: gh infra validate .github/settings.yml

  plan:
    name: Plan settings (drift check)
    runs-on: ubuntu-latest
    # Fork pull requests never receive repository secrets, so this job only
    # runs for same-repository pull requests, the schedule, and manual runs.
    # Fork PRs still get full manifest validation from the `validate` job.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install gh-infra
        run: gh extension install babarot/gh-infra --pin v0.13.0
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Mint read-only installation token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.GH_INFRA_APP_ID }}
          private-key: ${{ secrets.GH_INFRA_APP_PRIVATE_KEY }}
          # Narrows the minted token to exactly these read permissions and
          # errors out if the App installation is missing any of them,
          # instead of silently issuing an under- or over-scoped token. This
          # is a second, executable check on top of the App's own
          # (read-only) installation permissions.
          permission-administration: read
          permission-contents: read
          permission-issues: read
          permission-metadata: read

      - name: Preflight - confirm the token can read admin-scoped settings
        # `gh infra plan --ci` exits 0 even when every API call failed to
        # authenticate (verified empirically), so a stale or misconfigured
        # App token would otherwise be silently reported as "no drift".
        # Fail loudly here, before ever calling plan, if the token cannot
        # read Administration-scoped settings.
        run: gh api "repos/${{ github.repository }}/actions/permissions" --silent
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Run plan and enforce drift/failure detection
        run: |
          set -o pipefail

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # A settings pull request is expected to show a diff; failing on
            # every intentional change would break the review workflow.
            # The diff is still surfaced below for review.
            ci_flag=()
          else
            # Outside a pull request, any diff is unintended drift.
            ci_flag=(--ci)
          fi

          gh infra plan .github/settings.yml "${ci_flag[@]}" 2>&1 | tee plan.out
          plan_status=$?

          {
            echo '## gh-infra plan'
            echo
            echo '```'
            cat plan.out
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          # `plan --ci` can report zero changes when every fetch actually
          # failed (verified empirically), so never trust the exit code
          # alone: also fail if any repository was skipped due to errors.
          if grep -q "skipped due to errors" plan.out; then
            echo "::error::gh infra plan could not fetch live state for one or more repositories; treating as failure"
            exit 1
          fi

          exit "$plan_status"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
