# Add a path label only when every changed file matches that category.
# Branch names and PR titles are not classification inputs.
docs:
  - changed-files:
      - any-glob-to-all-files:
          - "{docs/**,**/*.md}"

test:
  - changed-files:
      - any-glob-to-all-files:
          - "{tests/**,**/*_test.go}"

build:
  - changed-files:
      - any-glob-to-all-files:
          - "{go.mod,go.sum}"

ci:
  - changed-files:
      - any-glob-to-all-files:
          - "{.github/workflows/**,.github/scripts/**}"
