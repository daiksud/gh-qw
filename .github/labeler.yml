# Only unambiguous all-file path categories receive automatic labels.
# Branch names and PR titles are not classification inputs.
# Release-affecting and other semantic labels are reviewed manually.
docs:
  - changed-files:
      - any-glob-to-all-files:
          - "{docs/**,**/*.md,**/*.mdx,.pages/src/**,.pages/public/**}"

test:
  - changed-files:
      - any-glob-to-all-files:
          - "{tests/**,.pages/test/**,**/*_test.go}"

build:
  - changed-files:
      - any-glob-to-all-files:
          - "{go.mod,go.sum,.pages/package.json,.pages/pnpm-lock.yaml,.pages/astro.config.mjs,.pages/vite.config.ts,.pages/tsconfig.json,.pages/pnpm-workspace.yaml}"

ci:
  - changed-files:
      - any-glob-to-all-files:
          - "{.github/workflows/**,.github/scripts/**,.pages/scripts/**}"
