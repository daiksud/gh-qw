name: Publish gh-qw release
description: Revalidate and publish the exact accepted release artifacts.
inputs:
  source-sha:
    description: Frozen full source commit SHA.
    required: true
  version:
    description: Validated release version.
    required: true
  previous-tag:
    description: Latest published stable release tag observed during metadata resolution.
    required: true
  previous-sha:
    description: Commit referenced by the observed latest published release.
    required: true
runs:
  using: composite
  steps:
    - name: Download complete accepted artifact set
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        pattern: release-*-${{ inputs.source-sha }}
        path: ${{ runner.temp }}/gh-qw-release-artifacts
        merge-multiple: true
        digest-mismatch: error
    - name: Verify artifact inventory, baseline, and conflicts
      shell: bash
      env:
        ARTIFACT_DIR: ${{ runner.temp }}/gh-qw-release-artifacts
        SOURCE_SHA: ${{ inputs.source-sha }}
        VERSION: ${{ inputs.version }}
        PREVIOUS_TAG: ${{ inputs.previous-tag }}
        PREVIOUS_SHA: ${{ inputs.previous-sha }}
      run: |
        set -euo pipefail
        [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
        [[ "$PREVIOUS_SHA" =~ ^[0-9a-f]{40}$ ]]
        [[ "$VERSION" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
        [[ "$PREVIOUS_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
        [[ "$(git rev-parse HEAD)" == "$SOURCE_SHA" ]]
        bash .github/scripts/release-artifacts.sh verify-all \
          "$VERSION" "$SOURCE_SHA" "$ARTIFACT_DIR"

        latest_tag="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)"
        [[ "$latest_tag" == "$PREVIOUS_TAG" ]] || {
          echo "The published baseline changed. Start a new release workflow." >&2
          exit 1
        }
        [[ "$(git rev-parse "refs/tags/${PREVIOUS_TAG}^{commit}")" == "$PREVIOUS_SHA" ]] || {
          echo "The published baseline tag moved or resolves to another commit." >&2
          exit 1
        }
        git merge-base --is-ancestor "$PREVIOUS_SHA" "$SOURCE_SHA" || {
          echo "The selected source does not include the published baseline." >&2
          exit 1
        }

        if existing_sha="$(git rev-parse --verify "refs/tags/${VERSION}^{commit}" 2>/dev/null)"; then
          [[ "$existing_sha" == "$SOURCE_SHA" ]] || {
            echo "The release tag already points to a different commit." >&2
            exit 1
          }
        fi
        release_error="$RUNNER_TEMP/existing-release-error"
        if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$VERSION" >/dev/null 2>"$release_error"; then
          echo "The release already exists and will not be replaced." >&2
          exit 1
        elif ! grep -Fq 'HTTP 404' "$release_error"; then
          cat "$release_error" >&2
          exit 1
        fi
    - name: Publish exact accepted binaries
      shell: bash
      env:
        ARTIFACT_DIR: ${{ runner.temp }}/gh-qw-release-artifacts
        SOURCE_SHA: ${{ inputs.source-sha }}
        VERSION: ${{ inputs.version }}
        PREVIOUS_TAG: ${{ inputs.previous-tag }}
      run: |
        set -euo pipefail
        gh release create "$VERSION" \
          --repo "$GITHUB_REPOSITORY" \
          --target "$SOURCE_SHA" \
          --title "$VERSION" \
          --generate-notes \
          --notes-start-tag "$PREVIOUS_TAG" \
          "$ARTIFACT_DIR/gh-qw-darwin-arm64" \
          "$ARTIFACT_DIR/gh-qw-linux-amd64" \
          "$ARTIFACT_DIR/gh-qw-windows-amd64.exe"
