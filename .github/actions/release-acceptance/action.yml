name: Accept gh-qw release artifact
description: Verify and exercise the transferred binary on its native runner.
inputs:
  target:
    description: Allowlisted native acceptance target.
    required: true
  version:
    description: Validated release version.
    required: true
  source-sha:
    description: Frozen full source commit SHA.
    required: true
runs:
  using: composite
  steps:
    - name: Validate native target
      id: target
      shell: bash
      working-directory: .action
      env:
        TARGET: ${{ inputs.target }}
        VERSION: ${{ inputs.version }}
        SOURCE_SHA: ${{ inputs.source-sha }}
      run: |
        set -euo pipefail
        [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
        [[ "$VERSION" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
        [[ "$(git rev-parse HEAD)" == "$SOURCE_SHA" ]]
        bash .github/scripts/release-artifacts.sh target "$TARGET" >> "$GITHUB_OUTPUT"
    - name: Require the target's native runner
      shell: bash
      env:
        EXPECTED_OS: ${{ steps.target.outputs.runner-os }}
        EXPECTED_ARCH: ${{ steps.target.outputs.runner-arch }}
      run: |
        set -euo pipefail
        [[ "$RUNNER_OS" == "$EXPECTED_OS" ]]
        [[ "$RUNNER_ARCH" == "$EXPECTED_ARCH" ]]
    - name: Download exact release artifact
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: release-${{ inputs.target }}-${{ inputs.source-sha }}
        path: ${{ runner.temp }}/gh-qw-release-artifact
        digest-mismatch: error
    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: .action/go.mod
        cache: true
    - name: Verify and exercise transferred product
      shell: bash
      working-directory: .action
      env:
        ARTIFACT_DIR: ${{ runner.temp }}/gh-qw-release-artifact
        TARGET: ${{ inputs.target }}
        VERSION: ${{ inputs.version }}
        SOURCE_SHA: ${{ inputs.source-sha }}
        ASSET: ${{ steps.target.outputs.asset }}
      run: |
        set -euo pipefail
        bash .github/scripts/release-artifacts.sh verify \
          "$TARGET" "$VERSION" "$SOURCE_SHA" "$ARTIFACT_DIR"
        binary="$ARTIFACT_DIR/$ASSET"
        if [[ "$RUNNER_OS" != Windows ]]; then
          chmod +x "$binary"
        fi
        [[ "$("$binary" --version)" == "gh qw version $VERSION" ]]
        GHQW_TEST_EXECUTABLE="$binary" go test ./...
