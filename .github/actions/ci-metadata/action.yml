name: Resolve gh-qw CI metadata
description: Return validated native build and acceptance matrices.
outputs:
  build-matrix:
    description: Validated native build target matrix.
    value: ${{ steps.metadata.outputs.build-matrix }}
  acceptance-matrix:
    description: Validated native acceptance target matrix.
    value: ${{ steps.metadata.outputs.acceptance-matrix }}
runs:
  using: composite
  steps:
    - name: Resolve and validate target matrices
      id: metadata
      shell: bash
      run: |
        set -euo pipefail
        build_matrix="$(bash .github/scripts/ci-artifacts.sh build-matrix)"
        acceptance_matrix="$(bash .github/scripts/ci-artifacts.sh acceptance-matrix)"
        jq -e '.include == [{"target":"linux-amd64","runner":"ubuntu-slim"},{"target":"linux-arm64","runner":"ubuntu-24.04-arm"},{"target":"darwin-arm64","runner":"macos-14"},{"target":"windows-amd64","runner":"windows-latest"}]' <<< "$build_matrix" >/dev/null
        jq -e '.include == [{"target":"linux-amd64","kind":"process","runner":"ubuntu-slim"},{"target":"linux-arm64","kind":"process","runner":"ubuntu-24.04-arm"},{"target":"darwin-arm64","kind":"process","runner":"macos-14"},{"target":"windows-amd64","kind":"process","runner":"windows-latest"}]' <<< "$acceptance_matrix" >/dev/null
        printf 'build-matrix=%s\nacceptance-matrix=%s\n' \
          "$build_matrix" "$acceptance_matrix" >> "$GITHUB_OUTPUT"
