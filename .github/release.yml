# Release-note categories use reviewed PR labels. Highest priority wins.
# Every merged PR is included.
changelog:
  categories:
    - title: "💥 BREAKING CHANGE"
      labels:
        - "BREAKING CHANGE"
    - title: "⚠️ DEPRECATED"
      labels:
        - "DEPRECATED"
      exclude:
        labels:
          - "BREAKING CHANGE"
    - title: "✨ New Feature"
      labels:
        - feat
        - perf
      exclude:
        labels:
          - "BREAKING CHANGE"
          - "DEPRECATED"
    - title: "🐛 Bug Fix"
      labels:
        - fix
      exclude:
        labels:
          - "BREAKING CHANGE"
          - "DEPRECATED"
          - feat
          - perf
    - title: "🛠️ Maintenance"
      labels:
        - "*"
      exclude:
        labels:
          - "BREAKING CHANGE"
          - "DEPRECATED"
          - feat
          - perf
          - fix
