# Categorizes generated GitHub Release notes by pull request label. See the
# versioning reference (docs/reference/versioning/) and ADR-0011 for the full
# label vocabulary and version-impact rules; this file is the executable half
# of the release-notes contract. Categories are evaluated top to bottom, and
# a pull request's first matching category wins.
#
# No exclude list: every merged pull request is visible in the release notes
# it ships in (see the versioning reference's "no override, no re-release"
# policy).
changelog:
  categories:
    - title: "💥 BREAKING CHANGE"
      labels:
        - "BREAKING CHANGE"
    - title: "⚠️ DEPRECATED"
      labels:
        - "DEPRECATED"
    - title: "🚀 Features"
      labels:
        - feat
        - perf
    - title: "🐛 Bug Fixes"
      labels:
        - fix
    - title: "⏪ Reverts"
      labels:
        - revert
    - title: "📝 Documentation"
      labels:
        - docs
    - title: "🧹 Maintenance"
      labels:
        - refactor
        - style
        - test
        - build
        - ci
        - chore
    - title: "🔧 Other Changes"
      labels:
        - "*"
