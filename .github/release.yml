# Release-note categories use reviewed PR labels; first match wins.
# Every merged PR is included. See docs/contributing.md#releases.
changelog:
  categories:
    - title: "💥 BREAKING CHANGE"
      labels:
        - "BREAKING CHANGE"
    - title: "⚠️ DEPRECATED"
      labels:
        - "DEPRECATED"
    - title: "🚀 Features"
      labels:
        - feat
        - perf
    - title: "🐛 Bug Fixes"
      labels:
        - fix
    - title: "⏪ Reverts"
      labels:
        - revert
    - title: "📝 Documentation"
      labels:
        - docs
    - title: "🧹 Maintenance"
      labels:
        - refactor
        - style
        - test
        - build
        - ci
        - chore
    - title: "🔧 Other Changes"
      labels:
        - "*"
