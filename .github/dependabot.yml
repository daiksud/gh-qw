# Dependabot supplies initial maintenance labels and Conventional Commit types.
# Branch names are unrestricted and do not determine release classifications.
# Reviewers can change PR types or add version labels when warranted.
version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    labels: ["build"]
    commit-message:
      prefix: "build"
      include: "scope"

  - package-ecosystem: "npm"
    directory: "/.pages"
    schedule:
      interval: "weekly"
    labels: ["build"]
    # The npm ecosystem value is also Dependabot's configuration key for
    # pnpm. Bun's separate ecosystem can update bun.lock, but it does not
    # support security updates. Keep pnpm at TypeScript 6.0.x until Astro's
    # language tooling supports TypeScript 7's programmatic API
    # (withastro/roadmap discussion 1321).
    ignore:
      - dependency-name: "typescript"
        update-types:
          - "version-update:semver-major"
    commit-message:
      prefix: "build"
      include: "scope"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels: ["ci"]
    commit-message:
      prefix: "ci"
      include: "scope"
